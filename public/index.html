<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { display: block; color: #bfd0e5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .auth, .editor { margin: 26px 0; padding: 18px 19px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2, .editor h2 { margin: 0 0 8px; font-size: 20px; }
    .auth label, .editor label { display: block; margin: 10px 0 4px; font-size: 15px; color: #bfd0e5; }
    .auth input, .editor input, .editor textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #51667c; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; }
    .editor textarea { min-height: 96px; resize: vertical; }
    button { margin-top: 14px; padding: 10px 18px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { background: #3b4f66; color: #ecf4ff; }
    button.danger { background: #d07384; color: #101a28; }
    li button { margin: 12px 8px 0 0; padding: 6px 14px; font-size: 15px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #auth-error, #notes-error { min-height: 1.5em; margin: 10px 0 0; color: #ffb3c0; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다. 실제 개인정보나 비밀번호를 적지 마세요.</p>
    <div class="notice">로그인한 사용자만 자기 메모를 읽고 쓸 수 있습니다. 서버가 확인한 사용자와 메모의 소유자가 같을 때만 읽기·수정·삭제가 되고, 남의 메모에는 접근할 수 없습니다.</div>
    <section class="auth" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <p id="auth-status" aria-live="polite">로그아웃 상태입니다.</p>
      <form id="login-form">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="submit" id="login-button">로그인</button>
      </form>
      <button type="button" id="logout-button" hidden>로그아웃</button>
      <p id="auth-error" role="alert"></p>
    </section>
    <section class="editor" id="editor" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title">메모 추가</h2>
      <form id="note-form">
        <label for="note-title">제목</label>
        <input id="note-title" type="text" maxlength="200" required>
        <label for="note-body">내용</label>
        <textarea id="note-body" maxlength="5000"></textarea>
        <button type="submit" id="note-save">추가</button>
        <button type="button" id="note-cancel" class="secondary" hidden>수정 취소</button>
      </form>
      <p id="notes-error" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인하면 내 메모가 보입니다.</li></ul>
  </main>
  <script type="module">
    // Supabase Auth 로그인·로그아웃. 두 값은 공개용입니다. 서버 전용 secret 키는 절대 넣지 않습니다.
    const SUPABASE_URL = 'https://vdidbiqssjipvdjldlns.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_K4cauLVHChRkt6PExGNBhw_vyGxz0G8'; // sb_publishable_ 로 시작하는 공개용 키를 여기에 붙여 넣습니다.

    const form = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const statusLine = document.querySelector('#auth-status');
    const errorLine = document.querySelector('#auth-error');
    const editor = document.querySelector('#editor');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteSave = document.querySelector('#note-save');
    const noteCancel = document.querySelector('#note-cancel');
    const editorTitle = document.querySelector('#editor-title');
    const notesError = document.querySelector('#notes-error');
    const list = document.querySelector('#notes');
    const REASONS = {
      invalid_credentials: '이메일 또는 비밀번호가 올바르지 않습니다.',
      email_not_confirmed: '이메일 인증이 아직 끝나지 않았습니다.',
      over_request_rate_limit: '시도가 너무 많습니다. 잠시 뒤 다시 시도해 주세요.',
      user_banned: '이 계정은 사용할 수 없습니다.',
    };
    const reasonOf = (error, fallback) => REASONS[error?.code] ?? `${fallback}: ${error?.message ?? '알 수 없는 오류'}`;

    let supabase = null;
    let editingId = null;
    let shownToken = null;
    const message = (text) => {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    };

    // 자료 요청은 로그인 토큰만 실어 보낸다. 서버가 토큰을 검사하므로 화면은 userId·role을 보내지 않는다.
    const api = async (method, path, payload) => {
      const { data } = await supabase.auth.getSession();
      const token = data.session?.access_token;
      if (!token) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        method, cache: 'no-store',
        headers: { Authorization: `Bearer ${token}`, ...(payload ? { 'Content-Type': 'application/json' } : {}) },
        body: payload ? JSON.stringify(payload) : undefined,
      });
      if (response.status === 401) throw new Error('로그인이 필요하거나 로그인이 만료되었습니다.');
      if (response.status === 404) throw new Error('메모를 찾을 수 없습니다.');
      if (!response.ok) throw new Error('요청을 처리하지 못했습니다.');
      return response.json();
    };

    const resetEditor = () => {
      editingId = null;
      noteForm.reset();
      editorTitle.textContent = '메모 추가';
      noteSave.textContent = '추가';
      noteCancel.hidden = true;
    };
    const startEdit = (note) => {
      editingId = note.id;
      noteTitle.value = note.title;
      noteBody.value = note.body;
      editorTitle.textContent = '메모 수정';
      noteSave.textContent = '수정 저장';
      noteCancel.hidden = false;
      noteTitle.focus();
    };
    const renderNote = (note) => {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const body = document.createElement('span');
      const edit = document.createElement('button');
      const remove = document.createElement('button');
      title.textContent = note.title;
      body.textContent = note.body;
      edit.type = 'button';
      edit.textContent = '수정';
      edit.className = 'secondary';
      edit.addEventListener('click', () => startEdit(note));
      remove.type = 'button';
      remove.textContent = '삭제';
      remove.className = 'danger';
      remove.addEventListener('click', async () => {
        if (!confirm('이 메모를 삭제할까요?')) return;
        notesError.textContent = '';
        try {
          await api('DELETE', `/api/notes/${encodeURIComponent(note.id)}`);
          if (editingId === note.id) resetEditor();
          await loadNotes();
        } catch (error) { notesError.textContent = error.message; }
      });
      item.append(title, body, edit, remove);
      return item;
    };
    const loadNotes = async () => {
      try {
        const notes = await api('GET', '/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) return message('아직 메모가 없습니다. 위에서 추가해 보세요.');
        list.replaceChildren(...notes.map(renderNote));
      } catch (error) { message(error.message); }
    };

    const render = (session) => {
      const email = session?.user?.email;
      statusLine.textContent = email ? `로그인됨: ${email}` : '로그아웃 상태입니다.';
      form.hidden = Boolean(email);
      logoutButton.hidden = !email;
      editor.hidden = !email;
      const token = session?.access_token ?? null;
      if (token === shownToken) return;
      shownToken = token;
      notesError.textContent = '';
      if (!token) {
        resetEditor();
        return message('로그인하면 내 메모가 보입니다.');
      }
      message('메모를 불러오는 중입니다.');
      loadNotes();
    };

    if (!SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_')) {
      errorLine.textContent = '공개용(publishable) 키가 아직 설정되지 않았습니다. 로그인을 쓸 수 없습니다.';
      loginButton.disabled = true;
    } else {
      try {
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
        supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        const { data } = await supabase.auth.getSession();
        render(data.session);
        supabase.auth.onAuthStateChange((_event, session) => render(session));
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          errorLine.textContent = '';
          loginButton.disabled = true;
          const { error } = await supabase.auth.signInWithPassword({
            email: form.elements.email.value.trim(),
            password: form.elements.password.value,
          });
          form.elements.password.value = '';
          loginButton.disabled = false;
          if (error) errorLine.textContent = reasonOf(error, '로그인에 실패했습니다');
        });
        logoutButton.addEventListener('click', async () => {
          errorLine.textContent = '';
          const { error } = await supabase.auth.signOut();
          if (error) errorLine.textContent = reasonOf(error, '로그아웃에 실패했습니다');
        });
        noteForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          notesError.textContent = '';
          noteSave.disabled = true;
          const payload = { title: noteTitle.value.trim(), body: noteBody.value };
          try {
            if (editingId) await api('PUT', `/api/notes/${encodeURIComponent(editingId)}`, payload);
            else await api('POST', '/api/notes', payload);
            resetEditor();
            await loadNotes();
          } catch (error) { notesError.textContent = error.message; }
          noteSave.disabled = false;
        });
        noteCancel.addEventListener('click', () => { notesError.textContent = ''; resetEditor(); });
      } catch (error) {
        errorLine.textContent = `로그인 기능을 불러오지 못했습니다: ${error?.message ?? '알 수 없는 오류'}`;
        loginButton.disabled = true;
      }
    }
  </script>
</body>
</html>
