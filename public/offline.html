<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>오프라인 | BYTE BACK 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 22px; }
    h1 { margin: 12px 0 16px; font-size: clamp(26px, 6vw, 38px); line-height: 1.25; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    .box { margin: 24px 0; padding: 16px 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 오프라인 안내</div>
    <h1>지금은 연결되어 있지 않습니다</h1>
    <p>자료실의 메모는 서버에만 있고, 이 기기에 저장해 두지 않습니다. 그래서 연결이 끊기면 메모를 볼 수도, 고칠 수도 없습니다.</p>
    <div class="box">
      <p>인터넷 연결을 확인한 뒤 이 화면을 새로고침해 주세요. 연결이 돌아오면 로그인한 사용자만 자기 메모를 볼 수 있습니다.</p>
    </div>
    <p>이 안내 화면에는 메모, 로그인 정보, 기기 정보가 들어 있지 않습니다. 앱을 설치했다는 표시만으로 기기 확인이 끝난 것은 아닙니다. 기기 확인은 서버가 요청마다 합니다.</p>
  </main>
</body>
</html>
